[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "school-assistant"
version = "0.1.0"
description = "Portable Moodle synchronization backend for School Assistant"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "anthropic>=0.72,<1",
  "apscheduler>=3.11,<4",
  "asyncpg>=0.30,<1",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "schedule>=1.2,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
school-assistant = "school_assistant.cli:main"

[tool.setuptools.packages.find]
where = [".", "packages/core/src", "apps/api/src", "apps/worker/src"]
include = [
  "agents*",
  "connectors*",
  "core*",
  "school_assistant*",
  "school_assistant_api*",
  "school_assistant_worker*",
]
exclude = ["tests*", "venv*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["school_assistant", "school_assistant_api", "school_assistant_worker"]
mypy_path = ["packages/core/src", "apps/api/src", "apps/worker/src"]
exclude = "^(agents|connectors|core)/"

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["agents.*", "connectors.*", "core.*"]
ignore_errors = true
